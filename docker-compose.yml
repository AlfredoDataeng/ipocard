version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ipocard-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ipocard_password
      POSTGRES_DB: ipocard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
